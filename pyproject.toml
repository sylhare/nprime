[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nprime"
dynamic = ["version"]
description = "Python library for primes algorithms"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GNU General Public License v3.0"}
authors = [
    {name = "sylhare", email = "sylhare@outlook.com"},
]
keywords = ["prime", "fermat", "miller rabin", "math"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Other Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU Library or Lesser General Public License (LGPL)",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Utilities"
]
dependencies = [
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=6.0",
    "xdoctest",
    "pypandoc",
]
build = [
    "hatchling",
    "pypandoc",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "xdoctest",
]
coverage = [
    "codecov",
    "codacy-coverage",
    "coverage>=6.0",
]

[project.urls]
Homepage = "https://github.com/Sylhare/nprime"
Repository = "https://github.com/Sylhare/nprime"
Issues = "https://github.com/Sylhare/nprime/issues"
Documentation = "https://github.com/Sylhare/nprime"

[tool.hatch.version]
path = "nprime/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["nprime"]

[tool.hatch.build.targets.sdist]
include = [
    "/nprime",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
addopts = "--xdoctest --xdoctest-style=google --ignore-glob=setup.py --ignore-glob=docs --ignore-glob=demo"
norecursedirs = ".git build __pycache__ demo docs"
filterwarnings = [
    "default",
]
testpaths = ["tests", "nprime"]

[tool.coverage.run]
source = ["nprime"]
omit = [
    "*/tests/*",
    "*/demo/*",
    "*/docs/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=6.0",
    "xdoctest",
    "pypandoc",
    "codecov",
    "codacy-coverage",
]
